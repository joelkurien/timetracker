<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #12151c;
    --surface: #1b202b;
    --surface-2: #232a3a;
    --surface-border: #2b3345;
    --text: #e8e6e1;
    --text-dim: #8b93a3;
    --text-faint: #566078;
    --accent: #d4a24c;
    --accent-soft: rgba(212,162,76,0.14);
    --accent-glow: rgba(212,162,76,0.35);
    --danger: #c06a5c;
  }

  * { box-sizing: border-box; margin:0; padding:0; user-select: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    height: 100vh;
    overflow: hidden;
    border: 1px solid var(--surface-border);
    border-radius: 12px;
  }

  /* Custom Drag Bar for Borderless Tauri Window */
  .titlebar {
    height: 32px;
    background: var(--surface);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    border-bottom: 1px solid var(--surface-border);
  }
  .titlebar-title { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; }
  .titlebar-actions button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .titlebar-actions button:hover { color: var(--text); }

  .wrap { padding: 16px; height: calc(100vh - 32px); overflow-y: auto; }

  .add-form { display: flex; gap: 6px; margin-bottom: 16px; }
  .add-form input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
  }
  .add-form button {
    background: var(--accent);
    color: #1a1409;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }

  .grid { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.running { border-color: var(--accent-glow); }

  .card-top { display: flex; justify-content: space-between; align-items: center; }
  .card-name { font-size: 14px; font-weight: 600; }
  .odometer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    background: #0d0f15;
    border: 1px solid var(--surface-border);
    border-radius: 6px;
    padding: 6px;
    text-align: center;
  }
  .card.running .odometer { color: var(--accent); }

  .btn-row { display: flex; gap: 6px; align-items: center; }
  .btn {
    border: none; border-radius: 5px; padding: 6px 10px;
    font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .btn-play { background: var(--accent-soft); color: var(--accent); }
  .btn-pause { background: var(--accent); color: #1a1409; }
  .btn-sec { background: transparent; color: var(--text-faint); }
  .btn-sec:hover { color: var(--text); }

  .drawer { display: none; flex-direction: column; gap: 6px; border-top: 1px solid var(--surface-border); padding-top: 8px; }
  .drawer.open { display: flex; }
  .ach-item { display: flex; gap: 6px; align-items: center; font-size: 11px; }
  .ach-item.completed { text-decoration: line-through; color: var(--text-faint); }

  /* --- Mini "Blinker" Mode Overlay --- */
  .mini-mode-bar {
    display: none;
    height: 100vh;
    width: 100vw;
    background: #0d0f15;
    padding: 0 10px;
    align-items: center;
    justify-content: space-between;
    border-radius: 12px;
  }
  .mini-mode-bar.active { display: flex; }

  .blinker-group { display: flex; align-items: center; gap: 8px; }
  .blinker-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text-faint);
  }
  .blinker-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 1.2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.85); }
  }

  .mini-task-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .mini-btn { background: transparent; border: none; color: var(--accent); cursor: pointer; font-size: 12px; }

  .hidden { display: none !important; }

  .btn-del-ach {
  background: transparent;
  border: none;
  color: var(--text-faint);
  cursor: pointer;
  font-size: 11px;
  padding: 0 4px;
}
.btn-del-ach:hover {
  color: var(--danger);
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-box {
  background: var(--surface);
  border: 1px solid var(--surface-border);
  border-radius: 12px;
  padding: 16px;
  width: 280px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.modal-box h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.modal-box p {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.4;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 4px;
}

.btn-danger {
  background: var(--danger);
  color: #ffffff;
}

.btn-danger:hover {
  opacity: 0.9;
}

</style>
</head>
<body>

<!-- Mini Blinker Mode (Shows when collapsed) -->
<div id="miniBar" class="mini-mode-bar" data-tauri-drag-region>
  <div class="blinker-group" data-tauri-drag-region>
    <div id="blinkerDot" class="blinker-dot"></div>
    <span id="miniTaskName" class="mini-task-name">No Active Task</span>
  </div>
  <button id="restoreBtn" class="mini-btn" title="Expand Window">⤢</button>
</div>

<!-- Main App View -->
<div id="mainView">
  <div class="titlebar" data-tauri-drag-region>
    <span class="titlebar-title">TIME LOG</span>
    <div class="titlebar-actions">
      <button id="minimizeBtn" title="Mini Mode">—</button>
    </div>
  </div>

  <div class="wrap">
    <form class="add-form" id="addForm">
      <input type="text" id="taskInput" placeholder="New task..." maxlength="50" required />
      <button type="submit">Add</button>
    </form>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>Delete Task?</h3>
    <p>Are you sure you want to delete this task? This action cannot be undone.</p>
    <div class="modal-actions">
      <button id="modalCancelBtn" class="btn btn-sec">Cancel</button>
      <button id="modalConfirmBtn" class="btn btn-danger">Delete</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
